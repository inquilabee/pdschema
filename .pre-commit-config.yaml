repos:
  - repo: local
    hooks:
      - id: shipgate-format
        name: shipgate format
        entry: bash -c 'scripts/ensure-venv.sh && uvx --python 3.13 shipgate format --target . --full-tree --project-env .venv'
        language: system
        pass_filenames: false
      - id: shipgate-check
        name: shipgate check
        entry: bash -c 'scripts/ensure-venv.sh && uvx --python 3.13 shipgate check --target . --full-tree --project-env .venv'
        language: system
        pass_filenames: false
      - id: shipgate-refactor
        name: shipgate refactor
        entry: uvx --python 3.13 shipgate refactor check .
        language: system
        pass_filenames: false
