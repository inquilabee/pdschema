repos:
  - repo: local
    hooks:
      - id: shipgate-format
        name: shipgate format
        entry: uvx shipgate format --target . --full-tree
        language: system
        pass_filenames: false
      - id: shipgate-check
        name: shipgate check
        entry: uvx shipgate check --target . --full-tree
        language: system
        pass_filenames: false
      - id: shipgate-refactor
        name: shipgate refactor
        entry: uvx shipgate refactor check .
        language: system
        pass_filenames: false
