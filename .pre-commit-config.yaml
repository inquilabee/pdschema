repos:
  - repo: local
    hooks:
      - id: shipgate-format
        name: shipgate format
        entry: scripts/shipgate-format.sh
        language: system
        pass_filenames: false
      - id: shipgate-check
        name: shipgate check
        entry: scripts/shipgate-check.sh
        language: system
        pass_filenames: false
      - id: shipgate-refactor
        name: shipgate refactor
        entry: uvx --python 3.13 shipgate refactor check .
        language: system
        pass_filenames: false
