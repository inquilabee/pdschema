[importlinter]
root_package = pdschema

[importlinter:contract:functions-not-imported-by-core]
name = Core modules must not import pdschema.functions
type = forbidden
source_modules =
    pdschema.schema
    pdschema.columns
    pdschema.types
    pdschema.validators
    pdschema.errors
forbidden_modules =
    pdschema.functions
