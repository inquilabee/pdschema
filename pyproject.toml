[project]
name = "pdschema"
version = "0.2.0"
description = "A Python library for validating pandas DataFrames using schemas"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<4.0"
dependencies = [
  "pandas>=1.3.0",
  "pyarrow>=7.0.0",
  "numpy>=1.22.0",
]
keywords = ["pandas", "schema", "validation", "dataframe", "pyarrow"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://inquilabee.github.io/pdschema/"
Documentation = "https://inquilabee.github.io/pdschema/"
Repository = "https://github.com/inquilabee/pdschema"

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "pre-commit>=3.6.0",
  "mkdocs-material>=9.0.0",
]

[tool.poetry]
authors = ["pdschema contributors"]
packages = [{ include = "pdschema" }]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["pdschema", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "N", "UP", "PL", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["pdschema"]

[tool.deptry]
pep621_dev_dependency_groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
