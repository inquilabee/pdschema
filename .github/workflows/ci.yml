name: CI
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Install Python
        run: uv python install 3.13
      - name: Install ShipGate tools
        run: uvx --python 3.13 shipgate install --suite full
      - name: Create project environment
        run: |
          uv venv .venv --python 3.13
          uv pip install --python .venv ".[dev]"
      - name: Quality gates
        run: |
          uvx --python 3.13 shipgate check \
            --target . \
            --full-tree \
            --error-format github \
            --project-env .venv
      - name: Structural refactor rules
        run: uvx --python 3.13 shipgate refactor check .
      - name: Tests
        run: uv run --python .venv pytest tests
